services:
  - type: web
    name: joineazy
    env: node
    plan: free
    region: ohio
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: priyansh191882@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SUPPORT_RECIPIENT_EMAIL
        value: priyansh191882@gmail.com
