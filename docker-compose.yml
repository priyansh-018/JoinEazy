version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: joineazy_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: joineazy_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - joineazy-network

  # Node.js + Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joineazy_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/joineazy_db
      JWT_SECRET: joineazy-production-secret-key-2026
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - joineazy-network

  # React + Tailwind + Nginx Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: joineazy_frontend
    restart: always
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    networks:
      - joineazy-network

volumes:
  pgdata:
    driver: local

networks:
  joineazy-network:
    driver: bridge
